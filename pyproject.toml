[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tabengine"
version = "0.1.0"
description = "Zero-shot predictive machine learning platform powered by Tabular Foundation Models (TabFM)"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [
    {name = "TabEngine Team", email = "dev@tabengine.ai"}
]
keywords = ["machine-learning", "tabular-data", "zero-shot", "tabfm", "rag", "scikit-learn"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "duckdb>=0.9.0",
    "scikit-learn>=1.2.0"
]

[project.urls]
Homepage = "https://tabengine.ai"
Repository = "https://github.com/tabengine-ai/tabengine-sdk"
